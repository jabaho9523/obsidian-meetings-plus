name: Release Obsidian plugin

on:
    push:
        tags:
            - "*.*.*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "20.x"
                  cache: "npm"
            - run: npm ci
            - run: npm run build
            - uses: actions/attest-build-provenance@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
            - name: Create or update release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release upload "$TAG" main.js manifest.json styles.css --clobber
                  else
                    gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --generate-notes
                  fi
